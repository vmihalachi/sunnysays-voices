le": "b59f2270e53c", "female": "88a685e402e8"}}, {"id": "poke-breath", "text": "Ciao. Un secondo lento, insieme. Ecco.", "en": "Hi. One slow second together. There.", "flavor": "calm", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-breath.m4a?v=2da81424ec44", "female": "../Voice/it/female/poke-breath.m4a?v=2595c6871660"}, "versions": {"male": "2da81424ec44", "female": "2595c6871660"}}, {"id": "battery-light", "text": "La tua batteria sta calando. La mia va benissimo, vado a luce.", "en": "Your battery's getting low. Mine's fine, I run on light.", "flavor": "playful", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/battery-light.m4a?v=f74dc297151f", "female": "../Voice/it/female/battery-light.m4a?v=28f8e8f58add"}, "versions": {"male": "f74dc297151f", "female": "28f8e8f58add"}}, {"id": "battery-lend", "text": "Batteria bassa, eh. Ti presterei un po' di sole, se potessi.", "en": "Low battery, friend. I'd lend you some sun if I could.", "flavor": "warm", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/battery-lend.m4a?v=058c350f99f9", "female": "../Voice/it/female/battery-lend.m4a?v=9e3fae93f134"}, "versions": {"male": "058c350f99f9", "female": "9e3fae93f134"}}, {"id": "battery-sleepy", "text": "La batteria sembra assonnata. Volevo solo dirtelo.", "en": "The battery looks sleepy. Just thought you'd want to know.", "flavor": "calm", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/battery-sleepy.m4a?v=9c51dcbcc219", "female": "../Voice/it/female/battery-sleepy.m4a?v=6fc39bd46b6d"}, "versions": {"male": "9c51dcbcc219", "female": "6fc39bd46b6d"}}, {"id": "battery-petals", "text": "Alla batteria restano solo gli ultimi petali.", "en": "The battery is down to its last few petals.", "flavor": "playful", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/battery-petals.m4a?v=599658a2cf65", "female": "../Voice/it/female/battery-petals.m4a?v=c72e8c17f35c"}, "versions": {"male": "599658a2cf65", "female": "c72e8c17f35c"}}, {"id": "battery-both-sun", "text": "Batteria quasi scarica. Se solo potesse prendere il sole come me.", "en": "Low battery. If only it could sit in the sun like me.", "flavor": "playful", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/battery-both-sun.m4a?v=9c0a393904e4", "female": "../Voice/it/female/battery-both-sun.m4a?v=99b6f7b90969"}, "versions": {"male": "9c0a393904e4", "female": "99b6f7b90969"}}, {"id": "battery-dusk", "text": "La batteria cala piano piano. Come un fiore al tramonto.", "en": "The battery is fading a bit. Like a flower at dusk.", "flavor": "calm", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/battery-dusk.m4a?v=d8f1ebe99ff7", "female": "../Voice/it/female/battery-dusk.m4a?v=ec0251dd9082"}, "versions": {"male": "d8f1ebe99ff7", "female": "ec0251dd9082"}}, {"id": "charging-both", "text": "Spina attaccata! Ora facciamo il pieno di energia insieme.", "en": "Plugged in! Now we're both soaking up energy.", "flavor": "warm", "slot": "charging", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/charging-both.m4a?v=038e2a34b445", "female": "../Voice/it/female/charging-both.m4a?v=5787717fcd89"}, "versions": {"male": "038e2a34b445", "female": "5787717fcd89"}}, {"id": "charging-bloom", "text": "Ah, la corrente. La batteria torna a fiorire.", "en": "Ah, power. The battery is blooming again.", "flavor": "playful", "slot": "charging", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/charging-bloom.m4a?v=f5caba7fca92", "female": "../Voice/it/female/charging-bloom.m4a?v=e4372f8a16dc"}, "versions": {"male": "f5caba7fca92", "female": "e4372f8a16dc"}}, {"id" : "../Voice/it/female/ui-test-voice.m4a?v=de12cc7be671"}, "versions": {"male": "87cba77e29c6", "female": "de12cc7be671"}}], "site": true, "languages": [{"code": "it", "name": "Italian", "recorded": true}], "title": "Sunny's voice", "notice": "Shared with friends who help review Sunny's voice. The recordings and texts are © sunnysays, all rights reserved. Please don't reuse, redistribute or train on them.", "app": "sunnysays", "flavors": ["playful", "wonder", "warm", "calm"]};
const KEY = `${DATA.app}-review-${DATA.lang}`;
for (const v of DATA.voices) v.label = v.kind.charAt(0).toUpperCase() + v.kind.slice(1);
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
const entry = id => (state[id] ||= { heard: {}, retake: {}, text: false, note: "" });
// heard and retake hold the take's version (its render hash), so a new take shows up unheard and its old retake flag
// lapses. `true` is from before versions: it counts for the current take.
const mark = (r, kind, field) => { const v = state[r.id]?.[field]?.[kind]; return v === true || (!!v && v === r.versions[kind]); };
const heard = (r, kind) => mark(r, kind, "heard");
const retake = (r, kind) => !!r.clips[kind] && mark(r, kind, "retake");
const newTake = (r, kind) => { const v = state[r.id]?.heard?.[kind]; return !!r.clips[kind] && !!v && v !== true && v !== r.versions[kind]; };
const flagged = r => !!state[r.id]?.text || DATA.voices.some(v => retake(r, v.kind));

const audio = new Audio();
const PAGE = 20;
let page = 0;
let current = 0, listening = false, lastVoice = DATA.voices[0].kind, queue = [];
const $ = s => document.querySelector(s);
for (const l of DATA.languages || [{ code: DATA.lang, name: DATA.languageName, recorded: true }]) {
  const o = document.createElement("option"); o.value = l.code; o.disabled = !l.recorded;
  o.textContent = l.recorded ? l.name : `${l.name} (not recorded yet)`; o.selected = l.code === DATA.lang;
  $("#lang").append(o);
}
$("#lang").onchange = () => { location.href = `${encodeURIComponent($("#lang").value)}.html`; };
document.title = `${DATA.title} · ${DATA.languageName}`;
document.querySelector("#title").textContent = DATA.title;
document.querySelector("#notice").textContent = DATA.notice;
for (const f of DATA.flavors) {
  const o = document.createElement("option"); o.value = f; o.textContent = f.charAt(0).toUpperCase() + f.slice(1);
  document.querySelector("#filter").append(o);
}
const SEND = DATA.site ? "Copied. Send it to whoever shared this page with you." : "Copied. Paste it to Claude.";
if (DATA.site) {
  $("#copy").textContent = "Copy my notes"; $("#notice").hidden = false;
  $("#summary").placeholder = "Flag what sounds off or reads wrong; your notes appear here.";
}
for (const v of [...DATA.voices, { kind: "both", name: "Both voices" }]) {
  const o = document.createElement("option"); o.value = v.kind; o.textContent = v.kind === "both" ? v.name : `${v.label}: ${v.name}`;
  $("#voice").append(o);
}

function visible() {
  const f = $("#filter").value;
  return DATA.rows.map((r, i) => i).filter(i => {
    const r = DATA.rows[i];
    if (f === "all") return true;
    if (f === "todo") return DATA.voices.some(v => r.clips[v.kind] && !heard(r, v.kind));
    if (f === "flagged") return flagged(r);
    if (f === "voiced") return Object.keys(r.clips).length > 0;
    if (f === "waiting") return !Object.keys(r.clips).length;
    return r.flavor === f;
  });
}

function render() {
  const list = $("#list"); list.innerHTML = "";
  const order = visible(), pages = Math.max(1, Math.ceil(order.length / PAGE));
  page = Math.min(page, pages - 1);
  for (const i of order.slice(page * PAGE, (page + 1) * PAGE)) {
    const r = DATA.rows[i], e = state[r.id] || { heard: {}, retake: {}, text: false, note: "" };
    const waiting = !Object.keys(r.clips).length;
    const done = !waiting && DATA.voices.every(v => !r.clips[v.kind] || heard(r, v.kind));
    const fresh = DATA.voices.filter(v => newTake(r, v.kind)).map(v => v.label.toLowerCase());
    const el = document.createElement("section");
    el.className = `row${r.joke && r.part > 1 ? " part" : ""}${i === current ? " current" : ""}${flagged(r) ? " flagged" : ""}${done ? " done" : ""}`;
    el.dataset.index = i;
    el.innerHTML = `
      <div class="num">${i + 1}</div>
      <div><div class="it"></div><div class="en"></div>
        <div class="meta">${fresh.length ? `<span class="chip new">New take: ${fresh.join(", ")}</span>` : ""}
        ${waiting ? `<span class="chip waiting" title="Not recorded for this text yet: check the words; the voice comes later">Waiting for a voice</span>` : ""}
        <span class="chip flavor-${DATA.flavors.indexOf(r.flavor) % 4}">${r.flavor || "ui"}</span><span class="chip">${r.slot}</span>
        ${r.joke ? `<span class="chip">Joke, part ${r.part} of ${r.parts}</span>` : ""}
        ${r.tags ? `<span class="chip">${r.tags}</span>` : ""}<span>${r.id}</span></div></div>
      <div class="actions"></div>
      <div class="note"><input placeholder="What's off? (optional)"></div>`;
    el.querySelector(".it").textContent = r.text;
    el.querySelector(".en").textContent = DATA.lang === "en" ? "" : r.en;  // English needs no gloss
    const actions = el.querySelector(".actions");
    for (const v of DATA.voices) {
      if (!r.clips[v.kind]) continue;
      const play = document.createElement("button");
      play.textContent = `▶ ${v.label}`; play.title = `${v.name}, key ${DATA.voices.indexOf(v) + 1}`;
      play.dataset.play = v.kind;
      play.onclick = ev => { ev.stopPropagation(); stopListening(); select(i); playOne(i, v.kind); };
      const flag = document.createElement("button");
      flag.className = `flag${retake(r, v.kind) ? " on" : ""}`; flag.textContent = "Retake";
      flag.title = `Re-record the ${v.label.toLowerCase()} voice's take`;
      flag.onclick = ev => { ev.stopPropagation(); toggleRetake(i, v.kind); };
      const pair = document.createElement("span"); pair.className = "pair";
      pair.append(play, flag); actions.append(pair);
    }
    const text = document.createElement("button");
    text.className = `flag${e.text ? " on" : ""}`; text.textContent = "Text"; text.title = `The ${DATA.languageName} should change (T)`;
    text.onclick = ev => { ev.stopPropagation(); toggleText(i); };
    actions.append(text);
    const input = el.querySelector(".note input");
    input.value = e.note || "";
    input.oninput = () => { entry(r.id).note = input.value; save(); summarize(); };
    input.onclick = ev => ev.stopPropagation();
    el.onclick = () => { select(i); };
    list.append(el);
  }
  pager(order.length, pages); progress(); summarize();
}

// Page buttons: the first, the last, and two either side of the current one, with gaps between.
function pager(count, pages) {
  const nav = $("#pager"); nav.innerHTML = ""; nav.hidden = pages < 2;
  const button = (label, to, title) => {
    const b = document.createElement("button"); b.textContent = label; b.title = title || `Page ${to + 1}`;
    if (to === page && !title) b.setAttribute("aria-current", "page");
    b.disabled = to < 0 || to >= pages || (to === page && !!title);
    b.onclick = () => goPage(to); nav.append(b);
  };
  button("‹ Previous", page - 1, "Previous page (←)");
  let last = -1;
  for (let p = 0; p < pages; p++) {
    if (p !== 0 && p !== pages - 1 && Math.abs(p - page) > 2) continue;
    if (p - last > 1) { const gap = document.createElement("span"); gap.className = "gap"; gap.textContent = "…"; nav.append(gap); }
    button(String(p + 1), p); last = p;
  }
  button("Next ›", page + 1, "Next page (→)");
  const range = document.createElement("span"); range.className = "range";
  range.textContent = `${page * PAGE + 1}–${Math.min(count, (page + 1) * PAGE)} of ${count}`;
  nav.append(range);
}

function goPage(p) {
  const order = visible(), pages = Math.ceil(order.length / PAGE);
  if (p < 0 || p >= pages || p === page) return;
  stopListening(); page = p; render(); select(order[p * PAGE], false); window.scrollTo({ top: 0 });
}

function progress() {
  let done = 0, total = 0;
  for (const r of DATA.rows) for (const v of DATA.voices) if (r.clips[v.kind]) { total++; if (heard(r, v.kind)) done++; }
  const waiting = DATA.rows.filter(r => !Object.keys(r.clips).length).length;
  $("#bar").style.width = `${total ? (100 * done / total) : 0}%`;
  $("#count").textContent = `${done} / ${total} heard` + (waiting ? ` · ${waiting} waiting for a voice` : "");
}

function summarize() {
  const retakes = {}, texts = [];
  for (const r of DATA.rows) {
    const e = state[r.id]; if (!e) continue;
    for (const v of DATA.voices) if (retake(r, v.kind)) (retakes[v.kind] ||= []).push(r.id + (e.note ? ` (${e.note})` : ""));
    if (e.text) texts.push(`${r.id}: "${r.text}"${e.note ? ` — ${e.note}` : ""}`);
  }
  const lines = [];
  for (const v of DATA.voices) if (retakes[v.kind]) lines.push(`Retake ${DATA.lang}/${v.kind} (${v.name}): ${retakes[v.kind].join(", ")}`);
  if (texts.length) lines.push(`Change the ${DATA.languageName} text:`, ...texts.map(t => `- ${t}`));
  $("#summary").value = lines.join("\n");
}

function select(i, scroll = true) {
  current = i;
  const pos = visible().indexOf(i);
  if (pos >= 0 && Math.floor(pos / PAGE) !== page) { page = Math.floor(pos / PAGE); render(); }
  document.querySelectorAll(".row").forEach(el => el.classList.toggle("current", +el.dataset.index === i));
  const el = document.querySelector(`.row[data-index="${i}"]`);
  if (el && scroll) el.scrollIntoView({ block: "center", behavior: "smooth" });
}

function markPlaying(i, kind) {
  document.querySelectorAll(".actions .playing").forEach(b => b.classList.remove("playing"));
  const b = document.querySelector(`.row[data-index="${i}"] [data-play="${kind}"]`);
  if (b) b.classList.add("playing");
}

function playOne(i, kind, then) {
  const r = DATA.rows[i]; if (!r.clips[kind]) { then && then(); return; }
  lastVoice = kind;
  audio.src = r.clips[kind]; audio.playbackRate = +$("#speed").value;
  markPlaying(i, kind);
  audio.onended = () => {
    entry(r.id).heard[kind] = r.versions[kind] || true; save(); progress();
    document.querySelectorAll(".actions .playing").forEach(b => b.classList.remove("playing"));
    const row = document.querySelector(`.row[data-index="${i}"]`);
    if (row && DATA.voices.every(v => !r.clips[v.kind] || heard(r, v.kind))) row.classList.add("done");
    then && then();
  };
  audio.play().catch(() => {});
}

function listenFrom(i) {
  const order = visible(); let pos = order.indexOf(i); if (pos < 0) pos = 0;
  const kinds = $("#voice").value === "both" ? DATA.voices.map(v => v.kind) : [$("#voice").value];
  const step = (p, k) => {
    if (!listening || p >= order.length) { stopListening(); return; }
    const idx = order[p]; if (k === 0) select(idx);
    const next = () => setTimeout(() => k + 1 < kinds.length ? step(p, k + 1) : step(p + 1, 0), 450);
    playOne(idx, kinds[k], next);
  };
  listening = true; $("#listen").textContent = "❚❚ Pause"; step(pos, 0);
}
function stopListening() { listening = false; audio.onended = null; audio.pause(); $("#listen").textContent = "▶ Listen through"; }

function toggleRetake(i, kind) {
  const r = DATA.rows[i]; if (!r.clips[kind]) return;
  entry(r.id).retake[kind] = retake(r, kind) ? false : (r.versions[kind] || true); save(); render(); select(i, false);
}
function toggleText(i) { const e = entry(DATA.rows[i].id); e.text = !e.text; save(); render(); select(i, false); }

$("#listen").onclick = () => listening ? stopListening() : listenFrom(current);
$("#filter").onchange = () => { stopListening(); page = 0; render(); };
$("#speed").onchange = () => { audio.playbackRate = +$("#speed").value; };
$("#copy").onclick = async () => {
  const text = $("#summary").value || "No flags: everything sounds right.";
  try { await navigator.clipboard.writeText(text); $("#copied").textContent = SEND; }
  catch { $("#summary").select(); document.execCommand("copy"); $("#copied").textContent = "Copied."; }
};
$("#clear").onclick = () => { if (confirm("Clear every flag and note?")) { for (const id in state) { state[id].retake = {}; state[id].text = false; state[id].note = ""; } save(); render(); } };

document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA" || ev.target.tagName === "SELECT") {
    if (ev.key === "Escape") ev.target.blur(); return;
  }
  const order = visible(), pos = order.indexOf(current);
  if (ev.key === " ") { ev.preventDefault(); listening ? stopListening() : listenFrom(current); }
  else if (ev.key === "ArrowDown" || ev.key === "j") { ev.preventDefault(); stopListening(); select(order[Math.min(order.length - 1, pos + 1)] ?? current); }
  else if (ev.key === "ArrowUp" || ev.key === "k") { ev.preventDefault(); stopListening(); select(order[Math.max(0, pos - 1)] ?? current); }
  else if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") { ev.preventDefault(); goPage(page + (ev.key === "ArrowLeft" ? -1 : 1)); }
  else if (ev.key === "1" || ev.key === "2") { const v = DATA.voices[+ev.key - 1]; if (v) { stopListening(); playOne(current, v.kind); } }
  else if (ev.key === "r") toggleRetake(current, lastVoice);
  else if (ev.key === "t") toggleText(current);
  else if (ev.key === "n") { const input = document.querySelector(`.row[data-index="${current}"] .note input`); const e = entry(DATA.rows[current].id); if (!input || getComputedStyle(input.parentElement).display === "none") { e.text = e.text || !DATA.voices.some(v => retake(DATA.rows[current], v.kind)); save(); render(); select(current, false); } setTimeout(() => document.querySelector(`.row[data-index="${current}"] .note input`)?.focus(), 0); ev.preventDefault(); }
});
render(); select(0, false);
</script>
</body>
</html>
