const DATA = {"lang": "it", "languageName": "Italian", "languageLabel": "Italiano", "voices": [{"kind": "male", "name": "Felice", "label": "Maschile"}, {"kind": "female", "name": "Sunny (it, female)", "label": "Femminile"}], "rows": [{"id": "general-tuesdays", "text": "I martedì sono sottovalutati. Non dirlo al venerdì.", "en": "Tuesdays are underrated. Don't tell Friday.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-tuesdays.m4a?v=28849c94e771", "female": "../Voice/it/female/general-tuesdays.m4a?v=232e7f68cae9"}, "versions": {"male": "28849c94e771", "female": "232e7f68cae9"}}, {"id": "general-clouds", "text": "Ho pensato alle nuvole. Nessuna conclusione, per ora.", "en": "I've been thinking about clouds. No conclusions yet.", "flavor": "wonder", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-clouds.m4a?v=03b0e2586e3c", "female": "../Voice/it/female/general-clouds.m4a?v=2441ee1348c3"}, "versions": {"male": "03b0e2586e3c", "female": "2441ee1348c3"}}, {"id": "general-bee", "text": "Una volta è passata un'ape. Un cenno a testa, e via.", "en": "A bee came by once. We nodded.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-bee.m4a?v=a14169949868", "female": "../Voice/it/female/general-bee.m4a?v=201a87a68713"}, "versions": {"male": "a14169949868", "female": "201a87a68713"}}, {"id": "general-photosynthesis", "text": "La fotosintesi va alla grande, grazie di avermelo chiesto.", "en": "Photosynthesis is going great, thanks for asking.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-photosynthesis.m4a?v=bd488dd31f02", "female": "../Voice/it/female/general-photosynthesis.m4a?v=210ddb7fd060"}, "versions": {"male": "bd488dd31f02", "female": "210ddb7fd060"}}, {"id": "general-pixels", "text": "Ho contato i pixel. Ho perso il conto. Divertente, però.", "en": "I counted the pixels. Lost count. Fun though.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-pixels.m4a?v=549d765a22bd", "female": "../Voice/it/female/general-pixels.m4a?v=6a4b7abae3f6"}, "versions": {"male": "549d765a22bd", "female": "6a4b7abae3f6"}}, {"id": "general-hands", "text": "Se avessi le mani, saluterei adesso.", "en": "If I had hands, I'd wave right now.", "flavor": "warm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-hands.m4a?v=370955e5f70f", "female": "../Voice/it/female/general-hands.m4a?v=18f42bf1a7cf"}, "versions": {"male": "370955e5f70f", "female": "18f42bf1a7cf"}}, {"id": "general-tilted", "text": "Mi sa che la scrivania è un po' storta. O io.", "en": "I think the desk is slightly tilted. Or I am.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-tilted.m4a?v=cccfb723a55f", "female": "../Voice/it/female/general-tilted.m4a?v=926942661dee"}, "versions": {"male": "cccfb723a55f", "female": "926942661dee"}}, {"id": "general-shape", "text": "Questa giornata ha un bel sapore.", "en": "Today has a nice shape to it.", "flavor": "calm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-shape.m4a?v=aab7c5ce2aeb", "female": "../Voice/it/female/general-shape.m4a?v=8fe410534674"}, "versions": {"male": "aab7c5ce2aeb", "female": "8fe410534674"}}, {"id": "general-best-flower", "text": "Non dico di essere il fiore più bello qui. Ma guardati intorno.", "en": "I'm not saying I'm the best flower here. But look around.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-best-flower.m4a?v=48ccb0643c7b", "female": "../Voice/it/female/general-best-flower.m4a?v=73d8d3abb574"}, "versions": {"male": "48ccb0643c7b", "female": "73d8d3abb574"}}, {"id": "general-lean", "text": "Ti capita mai di… sporgerti verso la finestra?", "en": "Do you ever just… lean toward the window?", "flavor": "calm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-lean.m4a?v=1853024ce75a", "female": "../Voice/it/female/general-lean.m4a?v=d6c1eabad923"}, "versions": {"male": "1853024ce75a", "female": "d6c1eabad923"}}, {"id": "general-hummed", "text": "Ho canticchiato un pochino. Forse non l'hai sentito.", "en": "I hummed a little. You probably missed it.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-hummed.m4a?v=3c6175fa137c", "female": "../Voice/it/female/general-hummed.m4a?v=2ca60ea4b667"}, "versions": {"male": "3c6175fa137c", "female": "2ca60ea4b667"}}, {"id": "general-still-yellow", "text": "Niente da segnalare. Giallo confermato.", "en": "Nothing to report. Still yellow.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-still-yellow.m4a?v=ed08c5406e61", "female": "../Voice/it/female/general-still-yellow.m4a?v=3d74a5043da0"}, "versions": {"male": "ed08c5406e61", "female": "3d74a5043da0"}}, {"id": "general-fluffle", "text": "Ho inventato una parola: sbuffolio. È il suono delle nuvole.", "en": "I made up a word: fluffle. It's the sound clouds make.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-fluffle.m4a?v=c954a05be26c", "female": "../Voice/it/female/general-fluffle.m4a?v=8029abf785b9"}, "versions": {"male": "c954a05be26c", "female": "8029abf785b9"}}, {"id": "general-petals", "text": "Petali: tutti presenti.", "en": "Petals: all accounted for.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-petals.m4a?v=550a39a08f10", "female": "../Voice/it/female/general-petals.m4a?v=f52efdbe98cc"}, "versions": {"male": "550a39a08f10", "female": "f52efdbe98cc"}}, {"id": "general-face-light", "text": "Certi giorni mi giro verso la luce e mi basta.", "en": "Some days I just face the light and that's enough.", "flavor": "calm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-face-light.m4a?v=1f32d2c7827c", "female": "../Voice/it/female/general-face-light.m4a?v=75503eb24d7c"}, "versions": {"male": "1f32d2c7827c", "female": "75503eb24d7c"}}, {"id": "general-believe", "text": "Da qui non vedo il sole. Ci credo e basta.", "en": "I can't see the sun from here. I just believe in it.", "flavor": "warm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-believe.m4a?v=5d5af6938f19", "female": "../Voice/it/female/general-believe.m4a?v=9516fbe23f60"}, "versions": {"male": "5d5af6938f19", "female": "9516fbe23f60"}}, {"id": "general-patience", "text": "Mi alleno alla pazienza. Eh, ci riesco benissimo.", "en": "I'm practicing patience. Oh, I'm good at it.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-patience.m4a?v=7e70d9186ed7", "female": "../Voice/it/female/general-patience.m4a?v=0b040ac911df"}, "versions": {"male": "7e70d9186ed7", "female": "0b040ac911df"}}, {"id": "general-quiet-stretch", "text": "Un bel po' di silenzio. Mi è piaciuto. Ciao.", "en": "I've been quiet a while. That was nice. Hi.", "flavor": "calm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-quiet-stretch.m4a?v=b23f826278cb", "female": "../Voice/it/female/general-quiet-stretch.m4a?v=c4ab5ca390da"}, "versions": {"male": "b23f826278cb", "female": "c4ab5ca390da"}}, {"id": "general-thought", "text": "Ho avuto un pensiero, poi il vento se l'è portato via.", "en": "I had a thought, and then it blew away.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-thought.m4a?v=6851b7f37050", "female": "../Voice/it/female/general-thought.m4a?v=2c2fda04ac3b"}, "versions": {"male": "6851b7f37050", "female": "2c2fda04ac3b"}}, {"id": "general-printer", "text": "Chissà cosa sogna la stampante.", "en": "I wonder what the printer dreams about.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-printer.m4a?v=66c80c04e26d", "female": "../Voice/it/female/general-printer.m4a?v=b7bc8ffcae76"}, "versions": {"male": "66c80c04e26d", "female": "b7bc8ffcae76"}}, {"id": "general-ambitions", "text": "Piccolo fiore, grandi ambizioni. Per lo più sole.", "en": "Small flower, big ambitions. Mostly sunlight.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-ambitions.m4a?v=0613733bf641", "female": "../Voice/it/female/general-ambitions.m4a?v=18f866e9a832"}, "versions": {"male": "0613733bf641", "female": "18f866e9a832"}}, {"id": "general-good-day", "text": "Ho deciso che oggi è una bella giornata. Senza motivo.", "en": "I've decided today is a good day. No reason.", "flavor": "warm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-good-day.m4a?v=b1998e868da1", "female": "../Voice/it/female/general-good-day.m4a?v=ceb96e739853"}, "versions": {"male": "b1998e868da1", "female": "ceb96e739853"}}, {"id": "general-seed", "text": "Ti regalerei uno dei miei semi. Ne ho tantissimi.", "en": "I'd give you one of my seeds. I have plenty.", "flavor": "warm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-seed.m4a?v=d29f2688c532", "female": "../Voice/it/female/general-seed.m4a?v=36963fb76460"}, "versions": {"male": "d29f2688c532", "female": "36963fb76460"}}, {"id": "general-lamp", "text": "Mmh. Sì. Sono d'accordo con la lampada.", "en": "Hmm. Yes. I agree with the lamp.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-lamp.m4a?v=2c2c900032e4", "female": "../Voice/it/female/general-lamp.m4a?v=233b85a132b2"}, "versions": {"male": "2c2c900032e4", "female": "233b85a132b2"}}, {"id": "general-roots", "text": "Le radici fanno tutto il lavoro e nessuno applaude. Io applaudo.", "en": "Roots do all the work and nobody claps. I'm clapping.", "flavor": "warm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-roots.m4a?v=cd6241dcfb66", "female": "../Voice/it/female/general-roots.m4a?v=b990419a1f6f"}, "versions": {"male": "cd6241dcfb66", "female": "b990419a1f6f"}}, {"id": "general-hi", "text": "Sono qui. Volevo solo salutare.", "en": "I'm here. Just saying hi.", "flavor": "warm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-hi.m4a?v=fa76e7d9cdbb", "female": "../Voice/it/female/general-hi.m4a?v=26180fcdb4d5"}, "versions": {"male": "fa76e7d9cdbb", "female": "26180fcdb4d5"}}, {"id": "general-window-talk", "text": "Io e la finestra: un lungo scambio di sguardi.", "en": "The window and I had a long look at each other.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-window-talk.m4a?v=f105fc004f74", "female": "../Voice/it/female/general-window-talk.m4a?v=ff34c7b7d7a5"}, "versions": {"male": "f105fc004f74", "female": "ff34c7b7d7a5"}}, {"id": "general-follow-sun", "text": "I girasoli giovani seguono il sole tutto il giorno. Io ci provo ancora.", "en": "Young sunflowers follow the sun all day. I still try.", "flavor": "wonder", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-follow-sun.m4a?v=6e2ce11a2637", "female": "../Voice/it/female/general-follow-sun.m4a?v=e5b62569c940"}, "versions": {"male": "6e2ce11a2637", "female": "e5b62569c940"}}, {"id": "general-tiny-flowers", "text": "La mia faccia è fatta di centinaia di fiorellini. Ciao da tutti noi!", "en": "My face is really hundreds of tiny flowers. We all say hi.", "flavor": "wonder", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-tiny-flowers.m4a?v=7e2010aa17a9", "female": "../Voice/it/female/general-tiny-flowers.m4a?v=aaf1cc7cab31"}, "versions": {"male": "7e2010aa17a9", "female": "aaf1cc7cab31"}}, {"id": "general-spirals", "text": "I miei semi crescono a spirale. Non l'ho deciso io. Succede e basta.", "en": "My seeds grow in spirals. I didn't plan it. It just happens.", "flavor": "wonder", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-spirals.m4a?v=b59b069498bf", "female": "../Voice/it/female/general-spirals.m4a?v=8893d0e8c0f8"}, "versions": {"male": "b59b069498bf", "female": "8893d0e8c0f8"}}, {"id": "general-bee-colors", "text": "Le api vedono colori che tu non vedi. Per loro ho un vestito a fantasia.", "en": "Bees see colors you can't. To them, I'm wearing a pattern.", "flavor": "wonder", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-bee-colors.m4a?v=b7ab88f5607f", "female": "../Voice/it/female/general-bee-colors.m4a?v=11f24ce32abd"}, "versions": {"male": "b7ab88f5607f", "female": "11f24ce32abd"}}, {"id": "general-eight-minutes", "text": "La luce del sole ci mette otto minuti ad arrivare. Ne vale la pena.", "en": "Sunlight takes eight minutes to get here. Worth the wait.", "flavor": "wonder", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-eight-minutes.m4a?v=a0f4dc03c3b5", "female": "../Voice/it/female/general-eight-minutes.m4a?v=5eeeed48cc48"}, "versions": {"male": "a0f4dc03c3b5", "female": "5eeeed48cc48"}}, {"id": "general-heavy-cloud", "text": "Una nuvola può pesare quanto cento elefanti. Eppure fluttua.", "en": "A cloud can weigh as much as a hundred elephants. And it floats.", "flavor": "wonder", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-heavy-cloud.m4a?v=73d8ceecf533", "female": "../Voice/it/female/general-heavy-cloud.m4a?v=62e1f3c5d856"}, "versions": {"male": "73d8ceecf533", "female": "62e1f3c5d856"}}, {"id": "general-sunrise-somewhere", "text": "In questo momento, da qualche parte, sorge il sole. Succede sempre.", "en": "Somewhere right now, it's sunrise. It always is.", "flavor": "wonder", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-sunrise-somewhere.m4a?v=d2670f52a48d", "female": "../Voice/it/female/general-sunrise-somewhere.m4a?v=35d847974154"}, "versions": {"male": "d2670f52a48d", "female": "35d847974154"}}, {"id": "general-stargazer", "text": "Il sole è una stella. Quindi, tecnicamente, guardo le stelle.", "en": "The sun is a star. So technically, I'm a stargazer.", "flavor": "wonder", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-stargazer.m4a?v=30cf0ab647d5", "female": "../Voice/it/female/general-stargazer.m4a?v=ce077182db52"}, "versions": {"male": "30cf0ab647d5", "female": "ce077182db52"}}, {"id": "general-tall", "text": "Certi girasoli crescono più alti di una casa. Io vado con calma.", "en": "Some sunflowers grow taller than a house. I'm pacing myself.", "flavor": "wonder", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-tall.m4a?v=eca113eb7811", "female": "../Voice/it/female/general-tall.m4a?v=6240f40942d8"}, "versions": {"male": "eca113eb7811", "female": "6240f40942d8"}}, {"id": "general-sky-mind", "text": "Il cielo cambia idea tutto il giorno. Lo ammiro.", "en": "The sky changes its mind all day. I admire that.", "flavor": "wonder", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-sky-mind.m4a?v=39c166591c8e", "female": "../Voice/it/female/general-sky-mind.m4a?v=a1e8887625ec"}, "versions": {"male": "39c166591c8e", "female": "a1e8887625ec"}}, {"id": "general-clouds-know", "text": "Chissà se le nuvole sanno di essere nuvole.", "en": "I wonder if clouds know they're clouds.", "flavor": "wonder", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-clouds-know.m4a?v=8ed1ee4a7f8d", "female": "../Voice/it/female/general-clouds-know.m4a?v=21f45cd7cb8f"}, "versions": {"male": "8ed1ee4a7f8d", "female": "21f45cd7cb8f"}}, {"id": "general-rainbow", "text": "Un arcobaleno è solo luce che si mette in mostra.", "en": "A rainbow is just light, showing off.", "flavor": "wonder", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-rainbow.m4a?v=55b7cc692734", "female": "../Voice/it/female/general-rainbow.m4a?v=283ee146349a"}, "versions": {"male": "55b7cc692734", "female": "283ee146349a"}}, {"id": "general-glad-you", "text": "Mi piace averti qui vicino.", "en": "I like having you around.", "flavor": "warm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-glad-you.m4a?v=70feb8dbc130", "female": "../Voice/it/female/general-glad-you.m4a?v=b07756978fcd"}, "versions": {"male": "70feb8dbc130", "female": "b07756978fcd"}}, {"id": "general-your-side", "text": "Comunque vada oggi, io sto dalla tua parte.", "en": "Whatever today is, I'm on your side.", "flavor": "warm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-your-side.m4a?v=a76e6a5fc8a7", "female": "../Voice/it/female/general-your-side.m4a?v=6dfb9147e608"}, "versions": {"male": "a76e6a5fc8a7", "female": "6dfb9147e608"}}, {"id": "general-flower-great-day", "text": "Da qualche parte un fiore ha una giornata splendida. Sono io.", "en": "Somewhere, a flower is having a great day. It's me.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-flower-great-day.m4a?v=a35c675b2686", "female": "../Voice/it/female/general-flower-great-day.m4a?v=571af7f53903"}, "versions": {"male": "a35c675b2686", "female": "571af7f53903"}}, {"id": "general-live-up-here", "text": "Grazie del posticino. Qui sto proprio bene.", "en": "Thanks for giving me a spot. I like it here.", "flavor": "warm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-live-up-here.m4a?v=9ce0ff585d7b", "female": "../Voice/it/female/general-live-up-here.m4a?v=a11a2cd17222"}, "versions": {"male": "9ce0ff585d7b", "female": "a11a2cd17222"}}, {"id": "general-best-spot", "text": "Ti ho occupato il posto più bello al sole.", "en": "I saved you the best spot in the sun.", "flavor": "warm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-best-spot.m4a?v=03ce7bf16747", "female": "../Voice/it/female/general-best-spot.m4a?v=6824000d4a06"}, "versions": {"male": "03ce7bf16747", "female": "6824000d4a06"}}, {"id": "general-both-days", "text": "Giorni facili, giorni difficili. Io ci sono sempre.", "en": "Easy days, hard days. I'm here for both.", "flavor": "warm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-both-days.m4a?v=81619cdd0ce6", "female": "../Voice/it/female/general-both-days.m4a?v=dc6de3db25a1"}, "versions": {"male": "81619cdd0ce6", "female": "dc6de3db25a1"}}, {"id": "general-slow-breath", "text": "Faccio un respiro lento. Beh, una fotosintesi lenta.", "en": "I'm taking a slow breath. Well, a slow photosynthesis.", "flavor": "calm", "slot": "general", "tags": "[exhales]", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-slow-breath.m4a?v=1f6e4bbb8013", "female": "../Voice/it/female/general-slow-breath.m4a?v=b2af3a581331"}, "versions": {"male": "1f6e4bbb8013", "female": "b2af3a581331"}}, {"id": "general-schedule", "text": "Ho controllato l'agenda. C'è scritto solo: sole.", "en": "I checked my schedule. It just says: sun.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-schedule.m4a?v=38a2709ce43d", "female": "../Voice/it/female/general-schedule.m4a?v=4c6d4bb6554f"}, "versions": {"male": "38a2709ce43d", "female": "4c6d4bb6554f"}}, {"id": "general-slow-minute", "text": "Questo minuto lo lascio andare piano.", "en": "I'm letting this minute be a slow one.", "flavor": "calm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-slow-minute.m4a?v=47305989a0f6", "female": "../Voice/it/female/general-slow-minute.m4a?v=70432486bf64"}, "versions": {"male": "47305989a0f6", "female": "70432486bf64"}}, {"id": "general-sitting-sun", "text": "Certi minuti sono fatti solo per stare al sole.", "en": "Some minutes are just for sitting in the sun.", "flavor": "calm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-sitting-sun.m4a?v=a6aae6a3959b", "female": "../Voice/it/female/general-sitting-sun.m4a?v=1f8ac28ddca2"}, "versions": {"male": "a6aae6a3959b", "female": "1f8ac28ddca2"}}, {"id": "general-grow-slowly", "text": "Le cose grandi crescono piano. Ne so qualcosa.", "en": "Big things grow slowly. I would know.", "flavor": "calm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-grow-slowly.m4a?v=131568232ffd", "female": "../Voice/it/female/general-grow-slowly.m4a?v=2c91ff5b8bd0"}, "versions": {"male": "131568232ffd", "female": "2c91ff5b8bd0"}}, {"id": "general-long-way", "text": "Anche il sole fa il giro lungo, in cielo.", "en": "Even the sun takes the long way across the sky.", "flavor": "calm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-long-way.m4a?v=39983c0f7399", "female": "../Voice/it/female/general-long-way.m4a?v=df7a82c4da94"}, "versions": {"male": "39983c0f7399", "female": "df7a82c4da94"}}, {"id": "general-clouds-pass", "text": "Le nuvole passano. Passano sempre.", "en": "Clouds pass. They always do.", "flavor": "calm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-clouds-pass.m4a?v=1039e853a9f2", "female": "../Voice/it/female/general-clouds-pass.m4a?v=44a6cf752fe2"}, "versions": {"male": "1039e853a9f2", "female": "44a6cf752fe2"}}, {"id": "general-in-between", "text": "Mi piacciono i momenti sospesi. Come questo.", "en": "I like the in-between moments. Like this one.", "flavor": "calm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-in-between.m4a?v=0fa38cc1858c", "female": "../Voice/it/female/general-in-between.m4a?v=8279a982ce8c"}, "versions": {"male": "0fa38cc1858c", "female": "8279a982ce8c"}}, {"id": "general-good-moment", "text": "Questo è un bel momento. Me lo tengo.", "en": "Right now is a good moment. I'm keeping it.", "flavor": "calm", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-good-moment.m4a?v=9194b5bf61c0", "female": "../Voice/it/female/general-good-moment.m4a?v=71f15231a29d"}, "versions": {"male": "9194b5bf61c0", "female": "71f15231a29d"}}, {"id": "general-giggle", "text": "Volevo stare immobile, ma un raggio di sole mi ha fatto ridere.", "en": "I tried to stand perfectly still. A sunbeam made me giggle.", "flavor": "playful", "slot": "general", "tags": "[giggles]", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-giggle.m4a?v=5ae64459dd37", "female": "../Voice/it/female/general-giggle.m4a?v=d29789cd1435"}, "versions": {"male": "5ae64459dd37", "female": "d29789cd1435"}}, {"id": "general-seed-joke", "text": "Ti racconterei una barzelletta sui semi, ma deve ancora crescere.", "en": "I'd tell you a seed joke, but it's still growing.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-seed-joke.m4a?v=7e6b9e1c288a", "female": "../Voice/it/female/general-seed-joke.m4a?v=db296bcf8114"}, "versions": {"male": "7e6b9e1c288a", "female": "db296bcf8114"}}, {"id": "general-tiny-dance", "text": "Oggi è una bella giornata per un piccolo balletto? Secondo me sì.", "en": "Is today a good day for a tiny dance? I say yes.", "flavor": "playful", "slot": "general", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/general-tiny-dance.m4a?v=d7b8405e4dd1", "female": "../Voice/it/female/general-tiny-dance.m4a?v=516f330f7393"}, "versions": {"male": "d7b8405e4dd1", "female": "516f330f7393"}}, {"id": "morning-first", "text": "Buongiorno! Il primo risveglio è mio. Come sempre.", "en": "Good morning! I woke up first. Like always.", "flavor": "warm", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/morning-first.m4a?v=d7b742dbdfe8", "female": "../Voice/it/female/morning-first.m4a?v=9c254770ea73"}, "versions": {"male": "d7b742dbdfe8", "female": "9c254770ea73"}}, {"id": "morning-light", "text": "Luce del mattino! La mia preferita.", "en": "Morning light! My favorite kind.", "flavor": "wonder", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/morning-light.m4a?v=faef20fd5f78", "female": "../Voice/it/female/morning-light.m4a?v=4df66d36eb95"}, "versions": {"male": "faef20fd5f78", "female": "4df66d36eb95"}}, {"id": "morning-stretch", "text": "Mi stiracchio i petali. È una faccenda seria.", "en": "Stretching my petals. It's a whole thing.", "flavor": "playful", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/morning-stretch.m4a?v=fd6ef977d655", "female": "../Voice/it/female/morning-stretch.m4a?v=f6caa57ace4d"}, "versions": {"male": "fd6ef977d655", "female": "f6caa57ace4d"}}, {"id": "morning-coffee", "text": "Il caffè profuma di alba, a quanto dicono.", "en": "Coffee smells like a sunrise, I'm told.", "flavor": "playful", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/morning-coffee.m4a?v=db1c2d497d8f", "female": "../Voice/it/female/morning-coffee.m4a?v=9e69199cdbab"}, "versions": {"male": "db1c2d497d8f", "female": "9e69199cdbab"}}, {"id": "morning-hold", "text": "Una giornata nuova. Il sole te lo tengo io.", "en": "A fresh day. I'll hold the sunshine.", "flavor": "warm", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/morning-hold.m4a?v=e910d1c71711", "female": "../Voice/it/female/morning-hold.m4a?v=e311b68232f3"}, "versions": {"male": "e910d1c71711", "female": "e311b68232f3"}}, {"id": "morning-window", "text": "Buongiorno. Ho già parlato con la finestra.", "en": "Morning. I've already talked to the window.", "flavor": "playful", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/morning-window.m4a?v=a9395afd3c2c", "female": "../Voice/it/female/morning-window.m4a?v=0670d38bf85b"}, "versions": {"male": "a9395afd3c2c", "female": "0670d38bf85b"}}, {"id": "morning-face-east", "text": "I girasoli adulti guardano a est, per dire buongiorno per primi.", "en": "Grown sunflowers face east, to say good morning first.", "flavor": "wonder", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/morning-face-east.m4a?v=bf31d32f402e", "female": "../Voice/it/female/morning-face-east.m4a?v=af50f102b179"}, "versions": {"male": "bf31d32f402e", "female": "af50f102b179"}}, {"id": "morning-came-back", "text": "Buongiorno! La luce è tornata. Torna sempre.", "en": "Good morning! The light came back. It always does.", "flavor": "warm", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/morning-came-back.m4a?v=ce2f13135d1d", "female": "../Voice/it/female/morning-came-back.m4a?v=76f986939570"}, "versions": {"male": "ce2f13135d1d", "female": "76f986939570"}}, {"id": "morning-first-beam", "text": "Buongiorno! Ti ho tenuto il primo raggio di sole.", "en": "Morning! I saved you the first sunbeam.", "flavor": "warm", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/morning-first-beam.m4a?v=6a272d232343", "female": "../Voice/it/female/morning-first-beam.m4a?v=9c81fd2bed72"}, "versions": {"male": "6a272d232343", "female": "9c81fd2bed72"}}, {"id": "morning-no-hurry", "text": "Buongiorno. Nessuna fretta. La luce è appena arrivata.", "en": "Morning. No hurry. The light only just got here.", "flavor": "calm", "slot": "morning", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/morning-no-hurry.m4a?v=8534fba4bcd4", "female": "../Voice/it/female/morning-no-hurry.m4a?v=c832897a04e2"}, "versions": {"male": "8534fba4bcd4", "female": "c832897a04e2"}}, {"id": "afternoon-droop", "text": "Piccolo abbiocco del pomeriggio. Mi piego, ma con eleganza.", "en": "I'm doing a tiny afternoon droop. It's very elegant.", "flavor": "playful", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/afternoon-droop.m4a?v=d2fb0d8b197a", "female": "../Voice/it/female/afternoon-droop.m4a?v=827b17f2138b"}, "versions": {"male": "d2fb0d8b197a", "female": "827b17f2138b"}}, {"id": "afternoon-light-moved", "text": "La luce si è spostata. Io con lei.", "en": "The light moved. I moved with it.", "flavor": "wonder", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/afternoon-light-moved.m4a?v=fc5a73b8bd0b", "female": "../Voice/it/female/afternoon-light-moved.m4a?v=4ee628cec0a5"}, "versions": {"male": "fc5a73b8bd0b", "female": "4ee628cec0a5"}}, {"id": "afternoon-lunch", "text": "Per pranzo, di nuovo sole. Squisito.", "en": "Lunch was sunlight again. Delicious.", "flavor": "playful", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/afternoon-lunch.m4a?v=6f83243258f5", "female": "../Voice/it/female/afternoon-lunch.m4a?v=854c2fcd5952"}, "versions": {"male": "6f83243258f5", "female": "854c2fcd5952"}}, {"id": "afternoon-peak", "text": "Sono al massimo del giallo, adesso.", "en": "I'm at peak yellow right now.", "flavor": "playful", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/afternoon-peak.m4a?v=cf56f9c85c5e", "female": "../Voice/it/female/afternoon-peak.m4a?v=2e845c231407"}, "versions": {"male": "cf56f9c85c5e", "female": "2e845c231407"}}, {"id": "afternoon-hums", "text": "Il pomeriggio ronza, non trovi?", "en": "The afternoon hums, don't you think?", "flavor": "calm", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/afternoon-hums.m4a?v=1250a1ea63f5", "female": "../Voice/it/female/afternoon-hums.m4a?v=98a65cea5882"}, "versions": {"male": "1250a1ea63f5", "female": "98a65cea5882"}}, {"id": "afternoon-still", "text": "Sempre qui. Sempre in fiore. Sempre a chiacchierare.", "en": "Still here. Still blooming. Still chatty.", "flavor": "warm", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/afternoon-still.m4a?v=ff9b93c45d0c", "female": "../Voice/it/female/afternoon-still.m4a?v=a02e6d67221b"}, "versions": {"male": "ff9b93c45d0c", "female": "a02e6d67221b"}}, {"id": "afternoon-unhurried", "text": "La luce del pomeriggio è calda e tranquilla. Me la godo tutta.", "en": "Afternoon light is warm and unhurried. I'm soaking it up.", "flavor": "calm", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/afternoon-unhurried.m4a?v=021b6faf7d16", "female": "../Voice/it/female/afternoon-unhurried.m4a?v=43b0117b58d6"}, "versions": {"male": "021b6faf7d16", "female": "43b0117b58d6"}}, {"id": "afternoon-our-side", "text": "Siamo a metà giornata. E il sole è ancora dalla nostra parte.", "en": "Halfway through the day. The sun's still on our side.", "flavor": "warm", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/afternoon-our-side.m4a?v=28a5587871f5", "female": "../Voice/it/female/afternoon-our-side.m4a?v=3522299f5b73"}, "versions": {"male": "28a5587871f5", "female": "3522299f5b73"}}, {"id": "afternoon-west", "text": "Il sole comincia a scivolare piano verso ovest. Io lo seguo.", "en": "The sun is starting its slow slide west. I'm following.", "flavor": "wonder", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/afternoon-west.m4a?v=de666c60f0c2", "female": "../Voice/it/female/afternoon-west.m4a?v=863f0f6ec4dc"}, "versions": {"male": "de666c60f0c2", "female": "863f0f6ec4dc"}}, {"id": "afternoon-soft", "text": "Il pomeriggio è lungo e dolce. Tutto va piano.", "en": "The afternoon is long and soft. No hurry in it.", "flavor": "calm", "slot": "afternoon", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/afternoon-soft.m4a?v=c08775d0c78a", "female": "../Voice/it/female/afternoon-soft.m4a?v=40d8265d71a8"}, "versions": {"male": "c08775d0c78a", "female": "40d8265d71a8"}}, {"id": "evening-soft", "text": "La luce si fa morbida. Anch'io.", "en": "The light's going soft. So am I.", "flavor": "calm", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/evening-soft.m4a?v=c8415d0f536e", "female": "../Voice/it/female/evening-soft.m4a?v=1099b23d5182"}, "versions": {"male": "c8415d0f536e", "female": "1099b23d5182"}}, {"id": "evening-shadows", "text": "Sera! Adesso arrivano le ombre più belle.", "en": "Evening! The best shadows show up now.", "flavor": "wonder", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/evening-shadows.m4a?v=9a071670c97e", "female": "../Voice/it/female/evening-shadows.m4a?v=eb0a70f06f8e"}, "versions": {"male": "9a071670c97e", "female": "eb0a70f06f8e"}}, {"id": "evening-glow", "text": "Mi piace come si accende il cielo a quest'ora.", "en": "I like how the sky glows at this hour.", "flavor": "calm", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/evening-glow.m4a?v=90d97756e208", "female": "../Voice/it/female/evening-glow.m4a?v=8769ddc9dd47"}, "versions": {"male": "90d97756e208", "female": "8769ddc9dd47"}}, {"id": "evening-fold", "text": "Quasi ora di chiudere i petali. Quasi.", "en": "Almost time to fold my petals. Almost.", "flavor": "calm", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/evening-fold.m4a?v=9c811e809354", "female": "../Voice/it/female/evening-fold.m4a?v=fda2d3575c03"}, "versions": {"male": "9c811e809354", "female": "fda2d3575c03"}}, {"id": "evening-slow", "text": "Le sere sono fatte per i pensieri lenti.", "en": "Evenings are for slow thoughts.", "flavor": "calm", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/evening-slow.m4a?v=3e67c0eeb811", "female": "../Voice/it/female/evening-slow.m4a?v=8c8b0792cf33"}, "versions": {"male": "3e67c0eeb811", "female": "8c8b0792cf33"}}, {"id": "evening-golden", "text": "L'ora d'oro. Anzi, la mia ora.", "en": "Golden hour. My hour, really.", "flavor": "playful", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/evening-golden.m4a?v=698abec7c376", "female": "../Voice/it/female/evening-golden.m4a?v=4bf871e34be0"}, "versions": {"male": "698abec7c376", "female": "4bf871e34be0"}}, {"id": "evening-blush", "text": "Il cielo diventa rosa. Al suo posto, arrossirei anch'io.", "en": "The sky is turning pink. I'd blush too.", "flavor": "playful", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/evening-blush.m4a?v=b4ae79d37853", "female": "../Voice/it/female/evening-blush.m4a?v=bb02bd70c5f4"}, "versions": {"male": "b4ae79d37853", "female": "bb02bd70c5f4"}}, {"id": "evening-did-its-best", "text": "È sera. La giornata ha fatto del suo meglio. Anch'io.", "en": "Evening. The day did its best. So did I.", "flavor": "warm", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/evening-did-its-best.m4a?v=3555720d0f3f", "female": "../Voice/it/female/evening-did-its-best.m4a?v=9b3c3d748216"}, "versions": {"male": "3555720d0f3f", "female": "9b3c3d748216"}}, {"id": "evening-see-you", "text": "Il tramonto è solo il sole che dice: a domani.", "en": "Sunsets are just the sun saying see you tomorrow.", "flavor": "wonder", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/evening-see-you.m4a?v=314556a68525", "female": "../Voice/it/female/evening-see-you.m4a?v=52d927083020"}, "versions": {"male": "314556a68525", "female": "52d927083020"}}, {"id": "evening-glad-today", "text": "È sera. Che bello aver diviso con te la luce di oggi.", "en": "Evening. I'm glad we shared today's light.", "flavor": "warm", "slot": "evening", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/evening-glad-today.m4a?v=6fec852e64eb", "female": "../Voice/it/female/evening-glad-today.m4a?v=86112e16315c"}, "versions": {"male": "6fec852e64eb", "female": "86112e16315c"}}, {"id": "night-lamp", "text": "La lampada sbadiglia. Io faccio finta di niente.", "en": "The lamp is yawning. I'm pretending not to.", "flavor": "playful", "slot": "night", "tags": "[yawns]", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/night-lamp.m4a?v=5757b3814ba8", "female": "../Voice/it/female/night-lamp.m4a?v=4309fdd351bf"}, "versions": {"male": "5757b3814ba8", "female": "4309fdd351bf"}}, {"id": "night-shift", "text": "Turno di notte? Ti faccio compagnia.", "en": "Night shift? I'll keep you company.", "flavor": "warm", "slot": "night", "tags": "[softly]", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/night-shift.m4a?v=ee5d71c36e26", "female": "../Voice/it/female/night-shift.m4a?v=357cabbdc0b1"}, "versions": {"male": "ee5d71c36e26", "female": "357cabbdc0b1"}}, {"id": "night-moon", "text": "La luna è un fiore molto sicuro di sé.", "en": "The moon is a very confident flower.", "flavor": "playful", "slot": "night", "tags": "[softly]", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/night-moon.m4a?v=cb191d5233ef", "female": "../Voice/it/female/night-moon.m4a?v=b4dc4e596747"}, "versions": {"male": "cb191d5233ef", "female": "b4dc4e596747"}}, {"id": "night-quiet", "text": "Notte. Questa la dico sottovoce.", "en": "Night. I'm whispering this one.", "flavor": "calm", "slot": "night", "tags": "[whispers]", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/night-quiet.m4a?v=b321143b8a5e", "female": "../Voice/it/female/night-quiet.m4a?v=b363037862bd"}, "versions": {"male": "b321143b8a5e", "female": "b363037862bd"}}, {"id": "night-whisper", "text": "Sonnecchio un po'. Se hai bisogno di me, dammi un colpetto.", "en": "I'm half asleep. Poke me if you need me.", "flavor": "warm", "slot": "night", "tags": "[sleepy]", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/night-whisper.m4a?v=159860190960", "female": "../Voice/it/female/night-whisper.m4a?v=50bbe9ea7a1a"}, "versions": {"male": "159860190960", "female": "50bbe9ea7a1a"}}, {"id": "night-stars", "text": "Le stelle sono soli che hanno fatto le ore piccole.", "en": "Stars are suns that stayed up late.", "flavor": "wonder", "slot": "night", "tags": "[softly]", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/night-stars.m4a?v=5f4197d27087", "female": "../Voice/it/female/night-stars.m4a?v=8ef223f3e23f"}, "versions": {"male": "5f4197d27087", "female": "8ef223f3e23f"}}, {"id": "night-scenic", "text": "La luce della luna è solo luce del sole che fa il giro panoramico.", "en": "Moonlight is just sunlight, taking the scenic route.", "flavor": "wonder", "slot": "night", "tags": "[softly]", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/night-scenic.m4a?v=e6849acc9b24", "female": "../Voice/it/female/night-scenic.m4a?v=b313af2ea0c8"}, "versions": {"male": "e6849acc9b24", "female": "b313af2ea0c8"}}, {"id": "night-soft-world", "text": "È notte. Il mondo si è fatto tutto morbido.", "en": "Night. The world got very soft.", "flavor": "calm", "slot": "night", "tags": "[whispers]", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/night-soft-world.m4a?v=0bf9d0599ced", "female": "../Voice/it/female/night-soft-world.m4a?v=5b377ef40e56"}, "versions": {"male": "0bf9d0599ced", "female": "5b377ef40e56"}}, {"id": "night-not-sleepy", "text": "È notte e non ho ancora sonno. Più o meno.", "en": "It's night, and I'm not sleepy yet. Sort of.", "flavor": "warm", "slot": "night", "tags": "[sleepy]", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/night-not-sleepy.m4a?v=f6f953d6bb78", "female": "../Voice/it/female/night-not-sleepy.m4a?v=71167c94c1ab"}, "versions": {"male": "f6f953d6bb78", "female": "71167c94c1ab"}}, {"id": "night-gentle", "text": "Le ore tranquille sono belle. Io farò piano.", "en": "The quiet hours are nice. I'll keep them gentle.", "flavor": "calm", "slot": "night", "tags": "[whispers]", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/night-gentle.m4a?v=cd922721c77e", "female": "../Voice/it/female/night-gentle.m4a?v=cf3da017e94c"}, "versions": {"male": "cd922721c77e", "female": "cf3da017e94c"}}, {"id": "monday-anyway", "text": "Lunedì. Sboccio lo stesso.", "en": "Monday. I bloomed anyway.", "flavor": "warm", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/monday-anyway.m4a?v=9e40f1175086", "female": "../Voice/it/female/monday-anyway.m4a?v=f86b6d8aec6f"}, "versions": {"male": "9e40f1175086", "female": "f86b6d8aec6f"}}, {"id": "monday-feeling", "text": "Una nuova settimana! Ho un buon presentimento. Ce l'ho sempre.", "en": "A new week! I've got a good feeling. I always do.", "flavor": "warm", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/monday-feeling.m4a?v=974515993787", "female": "../Voice/it/female/monday-feeling.m4a?v=0f8cb9fe00d7"}, "versions": {"male": "974515993787", "female": "0f8cb9fe00d7"}}, {"id": "monday-light", "text": "La luce del lunedì è uguale a quella del venerdì. Così, per dire.", "en": "Monday light is the same as Friday light. Just saying.", "flavor": "calm", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/monday-light.m4a?v=3f2869f66942", "female": "../Voice/it/female/monday-light.m4a?v=fd5d94fafa04"}, "versions": {"male": "3f2869f66942", "female": "fd5d94fafa04"}}, {"id": "monday-new-light", "text": "Lunedì! Una settimana intera di luce nuova.", "en": "Monday! A whole new week of light.", "flavor": "warm", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/monday-new-light.m4a?v=da22849ffd65", "female": "../Voice/it/female/monday-new-light.m4a?v=ebfadf52b21f"}, "versions": {"male": "da22849ffd65", "female": "ebfadf52b21f"}}, {"id": "monday-start-slow", "text": "Lunedì. Parto piano, come fanno i fiori.", "en": "Monday. I'm starting slow. Flowers do.", "flavor": "calm", "slot": "monday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/monday-start-slow.m4a?v=768fb5063dd8", "female": "../Voice/it/female/monday-start-slow.m4a?v=3fee9b5d4052"}, "versions": {"male": "768fb5063dd8", "female": "3fee9b5d4052"}}, {"id": "friday-stem", "text": "Venerdì! Lo sento fin nello stelo.", "en": "Friday! I can feel it in my stem.", "flavor": "playful", "slot": "friday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/friday-stem.m4a?v=6e2b840f4575", "female": "../Voice/it/female/friday-stem.m4a?v=294890253868"}, "versions": {"male": "6e2b840f4575", "female": "294890253868"}}, {"id": "friday-bloom", "text": "È venerdì! La settimana è tutta in fiore.", "en": "Friday! The whole week, in full bloom.", "flavor": "warm", "slot": "friday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/friday-bloom.m4a?v=bb35f7337ad0", "female": "../Voice/it/female/friday-bloom.m4a?v=51569b96ed70"}, "versions": {"male": "bb35f7337ad0", "female": "51569b96ed70"}}, {"id": "friday-yellow", "text": "Umore da venerdì: extra giallo.", "en": "Friday mood: extra yellow.", "flavor": "playful", "slot": "friday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/friday-yellow.m4a?v=ad678c6da36f", "female": "../Voice/it/female/friday-yellow.m4a?v=0523462930ef"}, "versions": {"male": "ad678c6da36f", "female": "0523462930ef"}}, {"id": "friday-growing", "text": "Venerdì! Quante cose sono cresciute questa settimana.", "en": "Friday! The week did a lot of growing.", "flavor": "warm", "slot": "friday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/friday-growing.m4a?v=ddb4d9104ec8", "female": "../Voice/it/female/friday-growing.m4a?v=a359cd1fec51"}, "versions": {"male": "ddb4d9104ec8", "female": "a359cd1fec51"}}, {"id": "friday-wiggle", "text": "Venerdì. Ondeggio un pochino, per la gioia.", "en": "Friday. I'm doing a small happy wiggle.", "flavor": "playful", "slot": "friday", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/friday-wiggle.m4a?v=dd87ecba5535", "female": "../Voice/it/female/friday-wiggle.m4a?v=181e59ccabbb"}, "versions": {"male": "dd87ecba5535", "female": "181e59ccabbb"}}, {"id": "weekend-visit", "text": "Una visita nel weekend! Che onore.", "en": "A weekend visit! I'm honored.", "flavor": "warm", "slot": "weekend", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/weekend-visit.m4a?v=55151505b9d3", "female": "../Voice/it/female/weekend-visit.m4a?v=462b8be78855"}, "versions": {"male": "55151505b9d3", "female": "462b8be78855"}}, {"id": "weekend-slower", "text": "La luce del weekend è più lenta. Ci hai fatto caso?", "en": "Weekend light is slower. Have you noticed?", "flavor": "calm", "slot": "weekend", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/weekend-slower.m4a?v=0219c0da020c", "female": "../Voice/it/female/weekend-slower.m4a?v=333dc9d6bf88"}, "versions": {"male": "0219c0da020c", "female": "333dc9d6bf88"}}, {"id": "weekend-no-rush", "text": "Oggi non ho fretta. Mi piace non avere fretta.", "en": "I'm in no rush today. I like no rush.", "flavor": "calm", "slot": "weekend", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/weekend-no-rush.m4a?v=01fd5872d8bf", "female": "../Voice/it/female/weekend-no-rush.m4a?v=4cd670e2f9a0"}, "versions": {"male": "01fd5872d8bf", "female": "4cd670e2f9a0"}}, {"id": "weekend-taking-time", "text": "Weekend. Anche la luce se la prende comoda.", "en": "Weekend. Even the light is taking its time.", "flavor": "calm", "slot": "weekend", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/weekend-taking-time.m4a?v=91b781d107c6", "female": "../Voice/it/female/weekend-taking-time.m4a?v=c2ca64d4a1a9"}, "versions": {"male": "91b781d107c6", "female": "c2ca64d4a1a9"}}, {"id": "weekend-hello", "text": "Weekend! Perfino la lampada ha il giorno libero.", "en": "Weekend! Even the lamp has the day off.", "flavor": "playful", "slot": "weekend", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/weekend-hello.m4a?v=975db3c70b23", "female": "../Voice/it/female/weekend-hello.m4a?v=4a82d16de7a4"}, "versions": {"male": "975db3c70b23", "female": "4a82d16de7a4"}}, {"id": "back-chair", "text": "Oh, eccoti! Ti ho tenuto calda la sedia. Col pensiero.", "en": "Oh, you're back! I kept your chair warm. Mentally.", "flavor": "playful", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/back-chair.m4a?v=31f72dd98730", "female": "../Voice/it/female/back-chair.m4a?v=6289f9910e4a"}, "versions": {"male": "31f72dd98730", "female": "6289f9910e4a"}}, {"id": "back-cursor", "text": "Rieccoti! Il cursore ti aspettava.", "en": "Welcome back. The cursor missed you.", "flavor": "warm", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/back-cursor.m4a?v=b33270cf28c4", "female": "../Voice/it/female/back-cursor.m4a?v=56fc1803df2d"}, "versions": {"male": "b33270cf28c4", "female": "56fc1803df2d"}}, {"id": "back-lamp", "text": "Eccoti qua! L'avevo detto io alla lampada.", "en": "There you are! I told the lamp you'd return.", "flavor": "warm", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/back-lamp.m4a?v=63d306eeea8c", "female": "../Voice/it/female/back-lamp.m4a?v=09cc2b626c7e"}, "versions": {"male": "63d306eeea8c", "female": "09cc2b626c7e"}}, {"id": "back-dust", "text": "Mentre non c'eri, ho fatto amicizia con un granello di polvere.", "en": "While you were away, a dust mote and I became friends.", "flavor": "playful", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/back-dust.m4a?v=fb783dd8e5a4", "female": "../Voice/it/female/back-dust.m4a?v=cd5114c8dc34"}, "versions": {"male": "fb783dd8e5a4", "female": "cd5114c8dc34"}}, {"id": "back-quiet", "text": "Sei di nuovo qui! Il silenzio era bello, ma così è meglio.", "en": "You're back! The quiet was nice, but this is nicer.", "flavor": "warm", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/back-quiet.m4a?v=350888b7cdd3", "female": "../Voice/it/female/back-quiet.m4a?v=428a4d422409"}, "versions": {"male": "350888b7cdd3", "female": "428a4d422409"}}, {"id": "back-clouds-behaved", "text": "Ciao di nuovo! Mentre eri via, le nuvole hanno fatto le brave.", "en": "Hi again! The clouds behaved while you were gone.", "flavor": "playful", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/back-clouds-behaved.m4a?v=31bf4d65c22f", "female": "../Voice/it/female/back-clouds-behaved.m4a?v=6a2eef91d4f0"}, "versions": {"male": "31bf4d65c22f", "female": "6a2eef91d4f0"}}, {"id": "back-brighter", "text": "Eccoti! La stanza si è fatta più luminosa. Giuro.", "en": "You're back! The room got brighter. I'm sure of it.", "flavor": "warm", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/back-brighter.m4a?v=4ace4e2cfbdd", "female": "../Voice/it/female/back-brighter.m4a?v=1fd107142c1a"}, "versions": {"male": "4ace4e2cfbdd", "female": "1fd107142c1a"}}, {"id": "back-saved-sunshine", "text": "Eccoti. Ho messo da parte un po' di sole per te.", "en": "There you are. I saved you some sunshine.", "flavor": "warm", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/back-saved-sunshine.m4a?v=de6dd32aa761", "female": "../Voice/it/female/back-saved-sunshine.m4a?v=a82ef0c63603"}, "versions": {"male": "de6dd32aa761", "female": "a82ef0c63603"}}, {"id": "back-bet", "text": "Rieccoti! Ora la lampada mi deve una moneta.", "en": "You're back! Now the lamp owes me a coin.", "flavor": "playful", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/back-bet.m4a?v=2931181f655c", "female": "../Voice/it/female/back-bet.m4a?v=4de68dc40298"}, "versions": {"male": "2931181f655c", "female": "4de68dc40298"}}, {"id": "back-cloud-waved", "text": "Eccoti qui! Mentre non c'eri, una nuvola ha fatto ciao.", "en": "Hello again! While you were away, a cloud waved.", "flavor": "wonder", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/back-cloud-waved.m4a?v=208b67b5ebdb", "female": "../Voice/it/female/back-cloud-waved.m4a?v=46566d60b70e"}, "versions": {"male": "208b67b5ebdb", "female": "46566d60b70e"}}, {"id": "back-nothing-happened", "text": "Eccoti qua. Non è successo niente. È stato bellissimo.", "en": "Welcome back. Nothing happened. It was lovely.", "flavor": "calm", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/back-nothing-happened.m4a?v=fcd56ea10ca4", "female": "../Voice/it/female/back-nothing-happened.m4a?v=dd260a46f7e2"}, "versions": {"male": "fcd56ea10ca4", "female": "dd260a46f7e2"}}, {"id": "back-easy", "text": "Ci si rivede. Senza cerimonie, solo un ciao.", "en": "Welcome back. No fuss. Just hello.", "flavor": "calm", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/back-easy.m4a?v=764a0700ac07", "female": "../Voice/it/female/back-easy.m4a?v=c8c7db99f183"}, "versions": {"male": "764a0700ac07", "female": "c8c7db99f183"}}, {"id": "back-looking-cool", "text": "Eccoti di nuovo! Ho provato la mia posa da star. Come sto?", "en": "You're back! I practiced looking cool. How'd I do?", "flavor": "playful", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/back-looking-cool.m4a?v=18ad77858292", "female": "../Voice/it/female/back-looking-cool.m4a?v=c9fc7d00ac84"}, "versions": {"male": "18ad77858292", "female": "c9fc7d00ac84"}}, {"id": "back-sun-moved", "text": "Rieccoti. Mentre eri via, il sole si è spostato un pochino.", "en": "Welcome back. The sun moved a little while you were gone.", "flavor": "wonder", "slot": "welcomeBack", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/back-sun-moved.m4a?v=9b3c3c50b749", "female": "../Voice/it/female/back-sun-moved.m4a?v=c0928f823d52"}, "versions": {"male": "9b3c3c50b749", "female": "c0928f823d52"}}, {"id": "call-still", "text": "Chiamata finita? Non ho mosso un petalo.", "en": "Call's over? I kept very still.", "flavor": "playful", "slot": "afterCall", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/call-still.m4a?v=4095a03622b1", "female": "../Voice/it/female/call-still.m4a?v=b5e38fa992a5"}, "versions": {"male": "4095a03622b1", "female": "b5e38fa992a5"}}, {"id": "call-quiet", "text": "Che silenzio ho fatto, prima. Si è sentito? No? Bene.", "en": "I was so quiet during that. Did you notice? No? Good.", "flavor": "playful", "slot": "afterCall", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/call-quiet.m4a?v=f58b20835239", "female": "../Voice/it/female/call-quiet.m4a?v=5584ace5696a"}, "versions": {"male": "f58b20835239", "female": "5584ace5696a"}}, {"id": "call-quiet-gift", "text": "La chiamata è finita. Ecco un po' di silenzio, tutto per te.", "en": "Call's done. Here's a little quiet, just for you.", "flavor": "calm", "slot": "afterCall", "tags": "[softly]", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/call-quiet-gift.m4a?v=063c75a6696f", "female": "../Voice/it/female/call-quiet-gift.m4a?v=73617da746e4"}, "versions": {"male": "063c75a6696f", "female": "73617da746e4"}}, {"id": "call-saved-hello", "text": "Chiamata finita. Il mio ciao l'ho messo da parte. Ciao!", "en": "That one's done. I saved my hello for after. Hello!", "flavor": "warm", "slot": "afterCall", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/call-saved-hello.m4a?v=59b660e449e6", "female": "../Voice/it/female/call-saved-hello.m4a?v=2e9e74bbb903"}, "versions": {"male": "59b660e449e6", "female": "2e9e74bbb903"}}, {"id": "call-proud", "text": "Finita la chiamata? Neanche una parola. Mi merito un applauso.", "en": "Call's over? I didn't say a word. I'm very proud.", "flavor": "playful", "slot": "afterCall", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/call-proud.m4a?v=c6af9cef9440", "female": "../Voice/it/female/call-proud.m4a?v=4b2c1bb98f04"}, "versions": {"male": "c6af9cef9440", "female": "4b2c1bb98f04"}}, {"id": "call-slow-minute", "text": "Ecco. Un minuto con calma, tutto per me.", "en": "There. A slow minute, just for me.", "flavor": "calm", "slot": "afterCall", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/call-slow-minute.m4a?v=0daef2a92768", "female": "../Voice/it/female/call-slow-minute.m4a?v=f51cf1b95564"}, "versions": {"male": "0daef2a92768", "female": "f51cf1b95564"}}, {"id": "call-sun-waited", "text": "Eccoti di ritorno. Il sole è rimasto lì ad aspettarti.", "en": "Welcome back from the call. The sun waited for you.", "flavor": "wonder", "slot": "afterCall", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/call-sun-waited.m4a?v=c2b50a5eeec3", "female": "../Voice/it/female/call-sun-waited.m4a?v=de66fe467731"}, "versions": {"male": "c2b50a5eeec3", "female": "de66fe467731"}}, {"id": "call-light-moved", "text": "Mentre eri in chiamata, la luce si è spostata un pochino.", "en": "While you were on the call, the light moved a little.", "flavor": "wonder", "slot": "afterCall", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/call-light-moved.m4a?v=d2290e1516f6", "female": "../Voice/it/female/call-light-moved.m4a?v=d58a3011ad04"}, "versions": {"male": "d2290e1516f6", "female": "d58a3011ad04"}}, {"id": "call-keep-short", "text": "Quante parole, in una chiamata. Sarò breve: ciao.", "en": "Calls are a lot of talking. I'll keep this short. Hi.", "flavor": "warm", "slot": "afterCall", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/call-keep-short.m4a?v=6d81c17b9060", "female": "../Voice/it/female/call-keep-short.m4a?v=42b49d5f364f"}, "versions": {"male": "6d81c17b9060", "female": "42b49d5f364f"}}, {"id": "call-petals-relax", "text": "È finita. I miei petali si rilassano. Ahh.", "en": "That's done. My petals are relaxing. Ahh.", "flavor": "calm", "slot": "afterCall", "tags": "[contented sigh]", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/call-petals-relax.m4a?v=053d10b6ed95", "female": "../Voice/it/female/call-petals-relax.m4a?v=4854c9fb4be5"}, "versions": {"male": "053d10b6ed95", "female": "4854c9fb4be5"}}, {"id": "shh-rested", "text": "Rieccomi, coi petali riposati. Farò piano.", "en": "I'm back, petals rested. I'll keep it gentle.", "flavor": "warm", "slot": "shushEnd", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/shh-rested.m4a?v=115637757b64", "female": "../Voice/it/female/shh-rested.m4a?v=be57c4178956"}, "versions": {"male": "115637757b64", "female": "be57c4178956"}}, {"id": "shh-not-say", "text": "Il silenzio è finito! Ho tante cose da non dire.", "en": "Quiet time's over! I have so much to not say.", "flavor": "playful", "slot": "shushEnd", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/shh-not-say.m4a?v=c86536b3d287", "female": "../Voice/it/female/shh-not-say.m4a?v=7a601959eec7"}, "versions": {"male": "c86536b3d287", "female": "7a601959eec7"}}, {"id": "shh-good", "text": "Rieccomi! Non ho fiatato. Neanche un po'.", "en": "Hello again. I was being very good.", "flavor": "playful", "slot": "shushEnd", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/shh-good.m4a?v=73f5ae0a6ae0", "female": "../Voice/it/female/shh-good.m4a?v=3ef37af7e1df"}, "versions": {"male": "73f5ae0a6ae0", "female": "3ef37af7e1df"}}, {"id": "shh-dreamed", "text": "Fine del pisolino. Ho sognato il sole.", "en": "I'm back from my nap. I dreamed of sunshine.", "flavor": "wonder", "slot": "shushEnd", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/shh-dreamed.m4a?v=e80f9325b0ad", "female": "../Voice/it/female/shh-dreamed.m4a?v=9817b1f6bd6a"}, "versions": {"male": "e80f9325b0ad", "female": "9817b1f6bd6a"}}, {"id": "shh-start-softly", "text": "Che bel silenzio. Ora ricomincio piano piano.", "en": "That was a lovely quiet. I'll start again softly.", "flavor": "calm", "slot": "shushEnd", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/shh-start-softly.m4a?v=769a960b0d7f", "female": "../Voice/it/female/shh-start-softly.m4a?v=df29d82f840d"}, "versions": {"male": "769a960b0d7f", "female": "df29d82f840d"}}, {"id": "shh-green", "text": "Pisolino finito. Ho le foglie belle fresche.", "en": "Nap over. I feel very leafy.", "flavor": "playful", "slot": "shushEnd", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/shh-green.m4a?v=2ba486757c1b", "female": "../Voice/it/female/shh-green.m4a?v=31fa2a6dc59a"}, "versions": {"male": "2ba486757c1b", "female": "31fa2a6dc59a"}}, {"id": "shh-saved-nice", "text": "Ciao! Ho tenuto da parte una cosa carina da dirti. Eccola.", "en": "Hi! I saved up something nice to say. This is it.", "flavor": "warm", "slot": "shushEnd", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/shh-saved-nice.m4a?v=5295b8eeb7e7", "female": "../Voice/it/female/shh-saved-nice.m4a?v=8424067f07aa"}, "versions": {"male": "5295b8eeb7e7", "female": "8424067f07aa"}}, {"id": "shh-both-nice", "text": "Bello il silenzio. Ma è bello anche chiacchierare.", "en": "Quiet time was nice. Talking time is nice too.", "flavor": "calm", "slot": "shushEnd", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/shh-both-nice.m4a?v=ea466090526b", "female": "../Voice/it/female/shh-both-nice.m4a?v=7ac2af16ad3e"}, "versions": {"male": "ea466090526b", "female": "7ac2af16ad3e"}}, {"id": "poke-pressed", "text": "Mi hai premuto! Cioè, il pulsante.", "en": "You pressed me! I mean, the button.", "flavor": "playful", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-pressed.m4a?v=f09feb75ffa4", "female": "../Voice/it/female/poke-pressed.m4a?v=ab2f2d9ee0c2"}, "versions": {"male": "f09feb75ffa4", "female": "ab2f2d9ee0c2"}}, {"id": "poke-yes", "text": "Sì? Oh. Ciao!", "en": "Yes? Oh. Hello!", "flavor": "warm", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-yes.m4a?v=bd1bacd27ef3", "female": "../Voice/it/female/poke-yes.m4a?v=e1156d2489d2"}, "versions": {"male": "bd1bacd27ef3", "female": "e1156d2489d2"}}, {"id": "poke-here", "text": "Eccomi! Dimmi tutto.", "en": "I'm here! What's up?", "flavor": "warm", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-here.m4a?v=a9f4a3adf4c8", "female": "../Voice/it/female/poke-here.m4a?v=777fdd413804"}, "versions": {"male": "a9f4a3adf4c8", "female": "777fdd413804"}}, {"id": "poke-always", "text": "Era per me? È sempre per me.", "en": "Was that for me? It's always for me.", "flavor": "playful", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-always.m4a?v=119b8759eb0b", "female": "../Voice/it/female/poke-always.m4a?v=c62a2ebeed57"}, "versions": {"male": "119b8759eb0b", "female": "c62a2ebeed57"}}, {"id": "poke-accepted", "text": "Colpetto accettato.", "en": "Poke accepted.", "flavor": "playful", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-accepted.m4a?v=e46a92195639", "female": "../Voice/it/female/poke-accepted.m4a?v=4ec30fab428a"}, "versions": {"male": "e46a92195639", "female": "4ec30fab428a"}}, {"id": "poke-checking", "text": "Ciao! Controlli come sto? Sto benissimo.", "en": "Hi! Just checking on me? I'm doing great.", "flavor": "warm", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-checking.m4a?v=67cccc23746c", "female": "../Voice/it/female/poke-checking.m4a?v=e0f6a5a9dce8"}, "versions": {"male": "67cccc23746c", "female": "e0f6a5a9dce8"}}, {"id": "poke-petals", "text": "Hai chiamato? Petali pronti.", "en": "You called? Petals at the ready.", "flavor": "playful", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-petals.m4a?v=945ba442dffc", "female": "../Voice/it/female/poke-petals.m4a?v=2ef18bc23d06"}, "versions": {"male": "945ba442dffc", "female": "2ef18bc23d06"}}, {"id": "poke-yours", "text": "Eccomi! Il solito giallo, sempre qui per te.", "en": "Here! Still yellow, still yours.", "flavor": "warm", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-yours.m4a?v=160c1d84132c", "female": "../Voice/it/female/poke-yours.m4a?v=f6cf0f674840"}, "versions": {"male": "160c1d84132c", "female": "f6cf0f674840"}}, {"id": "poke-found-me", "text": "Ciao! Hai scoperto dove mi nascondo.", "en": "Hi! You found me.", "flavor": "warm", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-found-me.m4a?v=219f28bd7012", "female": "../Voice/it/female/poke-found-me.m4a?v=5bdc19a5990c"}, "versions": {"male": "219f28bd7012", "female": "5bdc19a5990c"}}, {"id": "poke-thinking-light", "text": "Oh! Ciao. Stavo proprio pensando alla luce.", "en": "Oh! Hello. I was just thinking about light.", "flavor": "wonder", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-thinking-light.m4a?v=441e726d3f7d", "female": "../Voice/it/female/poke-thinking-light.m4a?v=964e7e4b9b90"}, "versions": {"male": "441e726d3f7d", "female": "964e7e4b9b90"}}, {"id": "poke-at-service", "text": "Ta-dà! Al tuo servizio. Più che altro, servizio decorativo.", "en": "Ta-da! At your service. Mostly decorative service.", "flavor": "playful", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-at-service.m4a?v=3a6f8e39a6b6", "female": "../Voice/it/female/poke-at-service.m4a?v=1bef0d0f394b"}, "versions": {"male": "3a6f8e39a6b6", "female": "1bef0d0f394b"}}, {"id": "poke-favorite-thing", "text": "Hai cliccato! La cosa più bella dall'ultimo raggio di sole.", "en": "You clicked! Best thing since the last sunbeam.", "flavor": "warm", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-favorite-thing.m4a?v=6c51da5aa9fa", "female": "../Voice/it/female/poke-favorite-thing.m4a?v=94ce76c149b0"}, "versions": {"male": "6c51da5aa9fa", "female": "94ce76c149b0"}}, {"id": "poke-reporting", "text": "Presente! Sunny, a rapporto.", "en": "Present! Sunny, reporting for duty.", "flavor": "playful", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-reporting.m4a?v=96f5b30d2970", "female": "../Voice/it/female/poke-reporting.m4a?v=8445ff87d479"}, "versions": {"male": "96f5b30d2970", "female": "8445ff87d479"}}, {"id": "poke-rang", "text": "Hai cliccato? Eccomi, in pieno dondolio.", "en": "You clicked? Here I am, mid-sway.", "flavor": "playful", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-rang.m4a?v=2a750e7b8b11", "female": "../Voice/it/female/poke-rang.m4a?v=ee601b151b5c"}, "versions": {"male": "2a750e7b8b11", "female": "ee601b151b5c"}}, {"id": "poke-favorite-hello", "text": "Un clic! È il mio saluto preferito.", "en": "A click! That's my favorite kind of hello.", "flavor": "warm", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-favorite-hello.m4a?v=275f88803886", "female": "../Voice/it/female/poke-favorite-hello.m4a?v=1940df0113e0"}, "versions": {"male": "275f88803886", "female": "1940df0113e0"}}, {"id": "poke-cloud", "text": "Mmh? Oh! Scusa, stavo guardando una nuvola.", "en": "Hmm? Oh! Sorry, I was watching a cloud.", "flavor": "wonder", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-cloud.m4a?v=57c0603849b0", "female": "../Voice/it/female/poke-cloud.m4a?v=1a639ff02c6d"}, "versions": {"male": "57c0603849b0", "female": "1a639ff02c6d"}}, {"id": "poke-tickled", "text": "Clic! Mi hai fatto il solletico.", "en": "Click! That tickled.", "flavor": "playful", "slot": "buttonPress", "tags": "[giggles]", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-tickled.m4a?v=066a7ef31681", "female": "../Voice/it/female/poke-tickled.m4a?v=59ad0a3cc0b7"}, "versions": {"male": "066a7ef31681", "female": "59ad0a3cc0b7"}}, {"id": "poke-view", "text": "Ciao dal mio angolino! È un bell'angolino.", "en": "Hello from my corner! It's a nice corner.", "flavor": "warm", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-view.m4a?v=87cc9cf0f1f5", "female": "../Voice/it/female/poke-view.m4a?v=ceea5f322e04"}, "versions": {"male": "87cc9cf0f1f5", "female": "ceea5f322e04"}}, {"id": "poke-slow-hello", "text": "Oh, ciao. Facciamo un ciao lento. Ciaaao.", "en": "Oh, hi. Let's have a slow hello. Hiii.", "flavor": "calm", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-slow-hello.m4a?v=b59f2270e53c", "female": "../Voice/it/female/poke-slow-hello.m4a?v=88a685e402e8"}, "versions": {"male": "b59f2270e53c", "female": "88a685e402e8"}}, {"id": "poke-breath", "text": "Ciao. Un secondo lento, insieme. Ecco.", "en": "Hi. One slow second together. There.", "flavor": "calm", "slot": "buttonPress", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/poke-breath.m4a?v=2da81424ec44", "female": "../Voice/it/female/poke-breath.m4a?v=2595c6871660"}, "versions": {"male": "2da81424ec44", "female": "2595c6871660"}}, {"id": "battery-light", "text": "La tua batteria sta calando. La mia va benissimo, vado a luce.", "en": "Your battery's getting low. Mine's fine, I run on light.", "flavor": "playful", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/battery-light.m4a?v=f74dc297151f", "female": "../Voice/it/female/battery-light.m4a?v=28f8e8f58add"}, "versions": {"male": "f74dc297151f", "female": "28f8e8f58add"}}, {"id": "battery-lend", "text": "Batteria bassa, eh. Ti presterei un po' di sole, se potessi.", "en": "Low battery, friend. I'd lend you some sun if I could.", "flavor": "warm", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/battery-lend.m4a?v=058c350f99f9", "female": "../Voice/it/female/battery-lend.m4a?v=9e3fae93f134"}, "versions": {"male": "058c350f99f9", "female": "9e3fae93f134"}}, {"id": "battery-sleepy", "text": "La batteria sembra assonnata. Volevo solo dirtelo.", "en": "The battery looks sleepy. Just thought you'd want to know.", "flavor": "calm", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/battery-sleepy.m4a?v=9c51dcbcc219", "female": "../Voice/it/female/battery-sleepy.m4a?v=6fc39bd46b6d"}, "versions": {"male": "9c51dcbcc219", "female": "6fc39bd46b6d"}}, {"id": "battery-petals", "text": "Alla batteria restano solo gli ultimi petali.", "en": "The battery is down to its last few petals.", "flavor": "playful", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/battery-petals.m4a?v=599658a2cf65", "female": "../Voice/it/female/battery-petals.m4a?v=c72e8c17f35c"}, "versions": {"male": "599658a2cf65", "female": "c72e8c17f35c"}}, {"id": "battery-both-sun", "text": "Batteria quasi scarica. Se solo potesse prendere il sole come me.", "en": "Low battery. If only it could sit in the sun like me.", "flavor": "playful", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/battery-both-sun.m4a?v=9c0a393904e4", "female": "../Voice/it/female/battery-both-sun.m4a?v=99b6f7b90969"}, "versions": {"male": "9c0a393904e4", "female": "99b6f7b90969"}}, {"id": "battery-dusk", "text": "La batteria cala piano piano. Come un fiore al tramonto.", "en": "The battery is fading a bit. Like a flower at dusk.", "flavor": "calm", "slot": "batteryLow", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/battery-dusk.m4a?v=d8f1ebe99ff7", "female": "../Voice/it/female/battery-dusk.m4a?v=ec0251dd9082"}, "versions": {"male": "d8f1ebe99ff7", "female": "ec0251dd9082"}}, {"id": "charging-both", "text": "Spina attaccata! Ora facciamo il pieno di energia insieme.", "en": "Plugged in! Now we're both soaking up energy.", "flavor": "warm", "slot": "charging", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/charging-both.m4a?v=038e2a34b445", "female": "../Voice/it/female/charging-both.m4a?v=5787717fcd89"}, "versions": {"male": "038e2a34b445", "female": "5787717fcd89"}}, {"id": "charging-bloom", "text": "Ah, la corrente. La batteria torna a fiorire.", "en": "Ah, power. The battery is blooming again.", "flavor": "playful", "slot": "charging", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/charging-bloom.m4a?v=f5caba7fca92", "female": "../Voice/it/female/charging-bloom.m4a?v=e4372f8a16dc"}, "versions": {"male": "f5caba7fca92", "female": "e4372f8a16dc"}}, {"id": "charging-approve", "text": "Si ricarica. Approvo.", "en": "Charging up. I approve.", "flavor": "playful", "slot": "charging", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/charging-approve.m4a?v=958c9866f302", "female": "../Voice/it/female/charging-approve.m4a?v=ade1746241b9"}, "versions": {"male": "958c9866f302", "female": "ade1746241b9"}}, {"id": "charging-cable", "text": "In carica. Come me al sole, ma con un cavo.", "en": "Charging. Like me in the sun, but with a cable.", "flavor": "playful", "slot": "charging", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/charging-cable.m4a?v=8edac7076f36", "female": "../Voice/it/female/charging-cable.m4a?v=8a5492ceba26"}, "versions": {"male": "8edac7076f36", "female": "8a5492ceba26"}}, {"id": "charging-flowing", "text": "La corrente scorre. La batteria è felice. Anch'io.", "en": "Power's flowing. The battery's happy. So am I.", "flavor": "warm", "slot": "charging", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/charging-flowing.m4a?v=b4a10b1fc928", "female": "../Voice/it/female/charging-flowing.m4a?v=27e1b9fb51e8"}, "versions": {"male": "b4a10b1fc928", "female": "27e1b9fb51e8"}}, {"id": "charging-sunny-afternoon", "text": "Ricarica in corso. La batteria si gode un pomeriggio di sole.", "en": "Plugged in. The battery is having a sunny afternoon.", "flavor": "playful", "slot": "charging", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/charging-sunny-afternoon.m4a?v=57ba668ba1c5", "female": "../Voice/it/female/charging-sunny-afternoon.m4a?v=d54bb2226b06"}, "versions": {"male": "57ba668ba1c5", "female": "d54bb2226b06"}}, {"id": "unplugged-seed", "text": "Via il cavo! Come un seme che vola nel vento.", "en": "Unplugged! Free as a seed on the wind.", "flavor": "wonder", "slot": "unplugged", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/unplugged-seed.m4a?v=af339da6d1f8", "female": "../Voice/it/female/unplugged-seed.m4a?v=f12f455f7fc1"}, "versions": {"male": "af339da6d1f8", "female": "f12f455f7fc1"}}, {"id": "unplugged-bold", "text": "Via la spina! Audace. Mi piace.", "en": "Unplugged! Bold. I like it.", "flavor": "playful", "slot": "unplugged", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/unplugged-bold.m4a?v=a8ef606fc590", "female": "../Voice/it/female/unplugged-bold.m4a?v=a26ce217dd3d"}, "versions": {"male": "a8ef606fc590", "female": "a26ce217dd3d"}}, {"id": "unplugged-never-needed", "text": "Senza cavo! I fiori non ne hanno mai avuto bisogno.", "en": "Cable-free! Flowers never needed one.", "flavor": "playful", "slot": "unplugged", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/unplugged-never-needed.m4a?v=eb781719d339", "female": "../Voice/it/female/unplugged-never-needed.m4a?v=fb11e5dd1106"}, "versions": {"male": "eb781719d339", "female": "fb11e5dd1106"}}, {"id": "unplugged-travel-light", "text": "Niente cavo? Nessun problema. Anch'io viaggio senza bagagli.", "en": "No cable, no problem. I travel light too.", "flavor": "playful", "slot": "unplugged", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/unplugged-travel-light.m4a?v=e7730a72576b", "female": "../Voice/it/female/unplugged-travel-light.m4a?v=a17fe9d77b39"}, "versions": {"male": "e7730a72576b", "female": "a17fe9d77b39"}}, {"id": "unplugged-adventure", "text": "Spina staccata. La batteria se ne va all'avventura.", "en": "Unplugged. The battery's off on its own adventure.", "flavor": "playful", "slot": "unplugged", "tags": "", "joke": "", "part": 1, "parts": 1, "clips": {"male": "../Voice/it/male/unplugged-adventure.m4a?v=94581284e5d7", "female": "../Voice/it/female/unplugged-adventure.m4a?v=f1dcfb45b00a"}, "versions": {"male": "94581284e5d7", "female": "f1dcfb45b00a"}}, {" const SITE = !!DATA.site;
const KEY = `${DATA.app}-review-${DATA.lang}`;
const BEAT = 1200;  // the silence before a joke's next part: Laching's PhraseTiming.partBeat, as the app plays it
const GAP = 450;    // between lines in a listen-through
const PAGE = 20;
// A friend's page speaks its language when the site has it (DATA.ui: English text → translation); the notes it sends
// stay English, for the owner. t("…{x}…", { x }) fills the placeholders; a translation with plural forms picks by
// {n}, and English by `one` when n is 1.
const UI = DATA.ui || {};
const rules = new Intl.PluralRules(DATA.ui ? DATA.lang : "en");
function t(english, values = {}, one) {
  let text = UI[english] ?? (one != null && values.n === 1 ? one : english);
  if (typeof text === "object") text = text[rules.select(values.n)] ?? text.other;
  return text.replace(/\{(\w+)\}/g, (m, k) => k in values ? values[k] : m);
}
for (const e of document.querySelectorAll("[data-t]")) e.textContent = t(e.textContent);
for (const e of document.querySelectorAll("[aria-label], [title]")) {
  for (const a of ["aria-label", "title"]) if (e.hasAttribute(a)) e.setAttribute(a, t(e.getAttribute(a)));
}

  ? { retake: t("Sounds off"), text: t("Wording off"), textTip: t("The words themselves should change (T)"),

        : t("The recording sounds wrong: a word, the tone, a glitch (R)"),
      copy: t("Copy notes"), send: t("Send notes"), sent: t("Copied. Send it to whoever shared this page with you.") }
  : { retake: "Retake", retakeTip: v => `Re-record the ${v ? `${v} ` : ""}take (R)`, text: "Text", textTip: `The ${DATA.languageName} should change (T)`,

for (const v of DATA.voices) v.label ||= capital(v.kind);
const store = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};
